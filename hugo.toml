baseURL = "https://khajievn.github.io/"
languageCode = "en-us"
title = "Nizomjon Khajiev"
theme = "PaperMod"
paginate = 5

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true

[params]
  env = "production"
  description = "PhD Researcher | Privacy Engineering | TEE & Zero-Knowledge Proofs"
  author = "Nizomjon Khajiev"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true

  [params.homeInfoParams]
    Title = "Nizomjon Khajiev"
    Content = """
PhD Researcher at [Monash University](https://www.monash.edu/) · [ACTION Lab](https://www.monash.edu/it/hcc/action-lab)

Building **Epsilon** — a privacy-preserving research infrastructure combining Trusted Execution Environments, Zero-Knowledge Proofs, and AI-assisted data governance.

Previously: Blockchain engineer in Seoul — ZK-rollups, smart contracts, and decentralized systems.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/khajievN"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:nizomjon.khajiev@monash.edu"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/khajievn"

  [params.cover]
    hidden = false
    hiddenInList = true
    hiddenInSingle = true

  [params.editPost]
    disabled = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 1
  [[menu.main]]
    identifier = "research"
    name = "Research"
    url = "/research/"
    weight = 2
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 3
  [[menu.main]]
    identifier = "publications"
    name = "Publications"
    url = "/publications/"
    weight = 4
  [[menu.main]]
    identifier = "experience"
    name = "Experience"
    url = "/experience/"
    weight = 5
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 6
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 7

[outputs]
  home = ["HTML", "RSS", "JSON"]
